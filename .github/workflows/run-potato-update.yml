name: Run potato update

on:
  push:
    branches:
      - recipe/add-potatoes-to-chicken-thighs

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recipe/add-potatoes-to-chicken-thighs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/add-potatoes-to-chicken-thighs.mjs
      - run: node scripts/validate-recipes.mjs
      - name: Commit recipe update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recipes.json
          git commit -m 'Add potatoes to chicken thigh recipe'
          git push origin HEAD:recipe/add-potatoes-to-chicken-thighs
