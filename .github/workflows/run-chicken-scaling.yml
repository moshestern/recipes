name: Run chicken scaling

on:
  push:
    branches:
      - recipe/scale-chicken-to-1kg

permissions:
  contents: write

jobs:
  scale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recipe/scale-chicken-to-1kg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scale-chicken-recipes.mjs
      - run: node scripts/validate-recipes.mjs
      - name: Commit scaled recipes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recipes.json
          git commit -m 'Scale chicken recipes to 1 kg'
          git push origin HEAD:recipe/scale-chicken-to-1kg
